[project]
name = "ga-common"
version = "0.2.1"
description = "Common library of the Lake Malawi cichlid genome structure system: paths, panel, provenance, throttle"
requires-python = ">=3.9"
dependencies = ["pyyaml"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
